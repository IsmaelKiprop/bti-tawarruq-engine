name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        env:
          AMANAH_ENABLED: "false"
          KENYA_INTEGRATION_MODE: mock
        run: pytest -q

  build-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install and build portal
        run: |
          npm ci
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-engine]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t bti-tawarruq-engine:ci .

      - name: Build portal image
        run: docker build -t bti-tawarruq-portal:ci ./portal
