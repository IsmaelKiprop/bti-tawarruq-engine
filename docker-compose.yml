services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tawarruq
      POSTGRES_PASSWORD: tawarruq
      POSTGRES_DB: tawarruq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tawarruq"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg://tawarruq:tawarruq@postgres:5432/tawarruq
      - AMANAH_WRITE_ENABLED=true
      - AMANAH_POLL_INTERVAL_SECONDS=5
      - KENYA_INTEGRATION_MODE=mock
      - SHARIAH_AUDIT_SERVICE_URL=http://shariah-audit:8001
      - AUTH_ENABLED=true
      - OPS_BOOTSTRAP_ADMIN_EMAIL=admin@buruujfintech.com
      - OPS_BOOTSTRAP_ADMIN_PASSWORD=ChangeMeNow!123
      - OPS_SEED_USERS=true
      - OPS_SEED_PASSWORD=BuruujSeed2026!
      - OPS_SEED_EMAIL_DOMAIN=buruujfintech.com
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-ops@buruujfintech.com}
      - PORTAL_PUBLIC_URL=${PORTAL_PUBLIC_URL:-https://ops.buruujfintech.com}
      - SEDANIA_MODE=${SEDANIA_MODE:-mock}
      - SEDANIA_API_URL=${SEDANIA_API_URL:-}
      - SEDANIA_API_KEY=${SEDANIA_API_KEY:-}
      - SEDANIA_PRODUCT_CODE=${SEDANIA_PRODUCT_CODE:-P01}
      - SEDANIA_INSTITUTION_PREFIX=${SEDANIA_INSTITUTION_PREFIX:-BTI}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "tawarruq.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]

  shariah-audit:
    build: .
    ports:
      - "8001:8001"
    environment:
      - SHARIAH_AUDIT_DATABASE_URL=sqlite:////app/data/shariah_audit.db
      - SHARIAH_AUDIT_PORT=8001
    volumes:
      - ./data:/app/data
    command: ["python", "shariah-audit-service/app.py"]

  portal:
    build:
      context: ./portal
      args:
        VITE_API_URL: /api/v1
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  